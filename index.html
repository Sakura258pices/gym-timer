<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>组间歇计时器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #111; color: #fff;
    font-family: -apple-system, "PingFang SC", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    user-select: none; overflow: hidden;
  }
  #time { font-size: 22vw; font-weight: 700; font-variant-numeric: tabular-nums; }
  #label { font-size: 16px; color: #888; margin-top: 8px; height: 22px; }
  #mainBtn {
    margin-top: 40px; width: 150px; height: 150px; border-radius: 50%;
    border: none; background: #2ecc71; color: #fff;
    font-size: 24px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(46,204,113,.35);
    transition: transform .1s;
  }
  #mainBtn:active { transform: scale(.95); }
  #mainBtn.stop { background: #e74c3c; }
  .presets { display: flex; gap: 10px; margin-top: 32px; flex-wrap: wrap; justify-content: center; }
  .preset {
    padding: 10px 18px; border-radius: 20px;
    border: 1px solid #333; background: #1a1a1a;
    color: #aaa; font-size: 16px;
  }
  .preset.active { border-color: #2ecc71; color: #2ecc71; }
</style>
</head>
<body>
  <div id="time">60</div>
  <div id="label">准备开始</div>
  <button id="mainBtn">开始</button>
  <div class="presets">
    <button class="preset" data-sec="30">30s</button>
    <button class="preset active" data-sec="60">60s</button>
    <button class="preset" data-sec="90">90s</button>
    <button class="preset" data-sec="120">120s</button>
    <button class="preset" data-sec="180">180s</button>
  </div>

<script>
  let duration = 60, remaining = 60, endTime = 0, timerId = null;
  let running = false, wakeLock = null;

  const timeEl = document.getElementById('time');
  const labelEl = document.getElementById('label');
  const btn = document.getElementById('mainBtn');

  function render() {
    timeEl.textContent = Math.ceil(remaining);
  }

  function setDuration(sec, el) {
    if (running) return;
    duration = remaining = sec;
    render();
    document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }

  async function lockScreen() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) {}
  }
  function unlockScreen() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  function start() {
    running = true;
    remaining = duration;
    endTime = Date.now() + duration * 1000;
    labelEl.textContent = '休息中…';
    btn.textContent = '停止';
    btn.classList.add('stop');
    lockScreen();
    timerId = setInterval(() => {
      remaining = (endTime - Date.now()) / 1000;
      if (remaining <= 0) { remaining = 0; finish(); }
      render();
    }, 100);
  }

  function stop() {
    clearInterval(timerId); timerId = null;
    running = false; unlockScreen();
    remaining = duration; render();
    labelEl.textContent = '已停止';
    btn.textContent = '开始'; btn.classList.remove('stop');
  }

  function finish() {
    clearInterval(timerId); timerId = null;
    running = false; unlockScreen();
    if (navigator.vibrate) navigator.vibrate([600, 200, 600, 200, 600]);
    labelEl.textContent = '休息结束，下一组！';
    btn.textContent = '再来'; btn.classList.remove('stop');
  }

  btn.onclick = () => running ? stop() : start();

  document.querySelectorAll('.preset').forEach(b => {
    b.onclick = () => setDuration(Number(b.dataset.sec), b);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) {
      remaining = (endTime - Date.now()) / 1000;
      if (remaining <= 0) { remaining = 0; finish(); }
      render();
      if (!wakeLock) lockScreen();
    }
  });
</script>
</body>
</html>
