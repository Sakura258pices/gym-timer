<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>组间歇计时器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #111; color: #fff;
    font-family: -apple-system, "PingFang SC", sans-serif;
    user-select: none;
  }
  #main {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }
  #time { font-size: 22vw; font-weight: 700; font-variant-numeric: tabular-nums; }
  #label { font-size: 16px; color: #888; margin-top: 8px; height: 22px; }
  #mainBtn {
    margin-top: 40px; width: 150px; height: 150px; border-radius: 50%;
    border: none; background: #2ecc71; color: #fff;
    font-size: 24px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(46,204,113,.35);
    transition: transform .1s, background .2s;
  }
  #mainBtn:active { transform: scale(.95); }
  #mainBtn.stop { background: #e74c3c; box-shadow: 0 8px 24px rgba(231,76,60,.35); }
  .presets { display: flex; gap: 10px; margin-top: 32px; flex-wrap: wrap; justify-content: center; padding: 0 20px; }
  .preset {
    padding: 10px 18px; border-radius: 20px;
    border: 1px solid #333; background: #1a1a1a;
    color: #aaa; font-size: 16px;
  }
  .preset.active { border-color: #2ecc71; color: #2ecc71; }
  #settingsBtn {
    position: fixed; top: 16px; right: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    border: none; background: #1a1a1a; color: #aaa;
    font-size: 22px; z-index: 10;
  }

  #settingsPanel {
    position: fixed; inset: 0;
    background: #181818; z-index: 20;
    transform: translateX(100%);
    transition: transform .25s ease;
    overflow-y: auto;
    padding: 20px;
  }
  #settingsPanel.open { transform: translateX(0); }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }
  .panel-header span { font-size: 20px; font-weight: 600; }
  #closeSettings {
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: #2a2a2a; color: #ccc; font-size: 22px;
  }
  .setting-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 0; border-bottom: 1px solid #2a2a2a;
  }
  .setting-item.column { flex-direction: column; align-items: stretch; gap: 12px; }
  .setting-item label { font-size: 16px; color: #ddd; }
  .switch {
    position: relative; width: 52px; height: 30px;
    background: #333; border-radius: 15px;
    transition: background .2s;
    cursor: pointer; flex-shrink: 0;
  }
  .switch.on { background: #2ecc71; }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; transition: left .2s;
  }
  .switch.on::after { left: 25px; }
  .segmented { display: flex; gap: 8px; }
  .segmented button {
    padding: 8px 16px; border-radius: 16px;
    border: 1px solid #333; background: #222; color: #aaa;
    font-size: 14px;
  }
  .segmented button.active { border-color: #2ecc71; color: #2ecc71; }
  input[type=range] { width: 100%; accent-color: #2ecc71; }
  .tone-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tone-list button {
    padding: 10px 16px; border-radius: 16px;
    border: 1px solid #333; background: #222; color: #aaa;
    font-size: 14px;
  }
  .tone-list button.active { border-color: #2ecc71; color: #2ecc71; }
  .test-btn {
    margin-top: 24px; width: 100%; padding: 14px;
    border-radius: 12px; border: none;
    background: #2a2a2a; color: #ddd; font-size: 16px;
  }
  #customToneName { font-size: 13px; color: #888; word-break: break-all; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="main">
    <div id="time">60</div>
    <div id="label">准备开始</div>
    <button id="mainBtn">开始</button>
    <div class="presets">
      <button class="preset" data-sec="30">30s</button>
      <button class="preset active" data-sec="60">60s</button>
      <button class="preset" data-sec="90">90s</button>
      <button class="preset" data-sec="120">120s</button>
      <button class="preset" data-sec="180">180s</button>
    </div>
    <button id="settingsBtn">⚙</button>
  </div>

  <div id="settingsPanel">
    <div class="panel-header">
      <span>设置</span>
      <button id="closeSettings">×</button>
    </div>

    <div class="setting-item">
      <label>振动提醒</label>
      <div class="switch" id="vibSwitch"></div>
    </div>

    <div class="setting-item" id="vibLevelRow">
      <label>振动强度</label>
      <div class="segmented" id="vibLevelGroup">
        <button data-level="weak">弱</button>
        <button data-level="medium">中</button>
        <button data-level="strong">强</button>
      </div>
    </div>

    <div class="setting-item">
